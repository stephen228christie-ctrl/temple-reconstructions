<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Tabernacle: a walkthrough of Exodus 25–30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --linen:#efe8d8; --tekhelet:#1d3566; --argaman:#5a2a63; --shani:#a3262c; --gold:#c7a042;
  --panel:rgba(245,239,226,.96); --text:#2a241b; --muted:#6d604b; --btn:#fbf6ea; --btn-text:#1d3566;
  --line:rgba(42,36,27,.15); --note:#f3e7c7; --tag:#fbf6ea; --tag-text:#1d3566;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --panel:rgba(20,30,58,.96); --text:#efe8d8; --muted:#b9ad95; --btn:#1d3566; --btn-text:#efe8d8;
    --line:rgba(239,232,216,.18); --note:rgba(199,160,66,.16); --tag:#1d3566; --tag-text:#efe8d8;
  }
}
:root[data-theme="dark"]{
  --panel:rgba(20,30,58,.96); --text:#efe8d8; --muted:#b9ad95; --btn:#1d3566; --btn-text:#efe8d8;
  --line:rgba(239,232,216,.18); --note:rgba(199,160,66,.16); --tag:#1d3566; --tag-text:#efe8d8;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#cdb994;overflow:hidden;font-family:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none;width:100%;height:100%}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.weave{height:6px;background:repeating-linear-gradient(90deg,var(--tekhelet) 0 16px,var(--argaman) 16px 32px,var(--shani) 32px 48px,var(--linen) 48px 54px,var(--gold) 54px 57px,var(--linen) 57px 60px)}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none;z-index:5}
.plaque{pointer-events:auto;background:var(--panel);border-radius:10px;overflow:hidden;box-shadow:0 6px 22px rgba(40,28,10,.25);max-width:62vw}
.plaque .in{padding:8px 12px 9px}
.plaque h1{font-family:'Alegreya',Georgia,serif;font-weight:700;font-size:19px;line-height:1.1;margin:0}
.plaque p{margin:2px 0 0;font-size:13px;color:var(--muted);font-style:italic;font-family:'Alegreya',Georgia,serif}
.pill{pointer-events:auto;border:0;background:var(--btn);color:var(--btn-text);border-radius:999px;padding:10px 15px;font-weight:700;font-size:14px;box-shadow:0 4px 16px rgba(40,28,10,.22);min-height:42px}
.dock{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:4}
.dock .pill{font-weight:500;font-size:13px;padding:9px 13px;min-height:38px}
.dock .pill b{font-weight:700}
#runBtn[aria-pressed="true"]{background:var(--gold);color:#1d1606}
.hint{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 100px);max-width:min(80vw,340px);background:var(--panel);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.35;box-shadow:0 6px 20px rgba(40,28,10,.22);z-index:4;transition:opacity .4s}
.hint.gone{opacity:0;pointer-events:none}
.stick{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:128px;height:128px;border-radius:50%;background:rgba(245,239,226,.28);border:2px solid rgba(245,239,226,.85);box-shadow:0 4px 18px rgba(40,28,10,.25);z-index:4;touch-action:none;-webkit-user-select:none;user-select:none}
.stick::after{content:'';position:absolute;inset:30%;border-radius:50%;border:1px dashed rgba(245,239,226,.7)}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--btn);border:3px solid var(--gold);box-shadow:0 4px 12px rgba(40,28,10,.35);z-index:1}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:var(--tag);color:var(--tag-text);font-family:'Alegreya',Georgia,serif;font-weight:700;font-size:13px;padding:4px 9px;border-radius:6px;white-space:nowrap;box-shadow:0 3px 10px rgba(40,28,10,.25);border-bottom:3px solid var(--gold)}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:60vh;background:var(--panel);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(40,28,10,.3);z-index:8;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s ease}
.sheet.open{transform:none}
.sheet .weave{border-radius:16px 16px 0 0;flex:none}
.sheet .head{display:flex;gap:10px;align-items:flex-start;padding:12px 16px 6px;flex:none}
.sheet h2{font-family:'Alegreya',Georgia,serif;font-size:23px;line-height:1.15;margin:0}
.sheet .ref{margin:3px 0 0;color:var(--muted);font-family:'Alegreya',Georgia,serif;font-style:italic;font-size:15px}
.x{margin-left:auto;border:0;background:transparent;color:var(--text);font-size:15px;padding:8px 10px;border-radius:8px;text-decoration:underline;text-underline-offset:3px;flex:none}
.sheet .body{overflow-y:auto;padding:4px 16px calc(env(safe-area-inset-bottom,0px) + 18px);font-size:16px;line-height:1.5}
.sheet ul{margin:6px 0 10px;padding-left:18px}
.sheet li{margin:0 0 7px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.acts button{border:0;background:var(--tekhelet);color:#efe8d8;border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px}
.dims{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:6px 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.dims dt{color:var(--muted)}
.dims dd{margin:0;font-weight:500}
.note{background:var(--note);border-left:4px solid var(--gold);padding:9px 12px;border-radius:0 8px 8px 0;font-size:15px;margin:4px 0 6px}
.note strong{font-family:'Alegreya',Georgia,serif}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(350px,90vw);background:var(--panel);z-index:9;transform:translateX(105%);transition:transform .28s ease;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(40,28,10,.3);padding-top:env(safe-area-inset-top,0px)}
.drawer.open{transform:none}
.drawer .head{display:flex;align-items:center;padding:12px 14px 8px}
.drawer h2{font-family:'Alegreya',Georgia,serif;font-size:22px;margin:0}
.drawer .list{overflow-y:auto;padding:0 8px calc(env(safe-area-inset-bottom,0px) + 20px)}
.drawer h3{font-family:'Alegreya',Georgia,serif;font-style:italic;font-weight:500;font-size:16px;color:var(--muted);margin:14px 8px 4px}
.place{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:9px 10px;border-radius:8px}
.place:hover{background:var(--line)}
.place span{display:block;font-weight:700;font-size:16px}
.place small{color:var(--muted);font-size:13px}
.fade{position:fixed;inset:0;background:#f1e6cc;opacity:0;pointer-events:none;z-index:7;transition:opacity .22s}
.fade.on{opacity:1}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:#e9dcbf;color:#1d3566;font-family:'Alegreya',Georgia,serif;font-size:20px;z-index:20;transition:opacity .5s;padding:20px;text-align:center}
.loading.done{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.sheet,.drawer,.fade,.hint,.loading{transition:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div class="top">
  <div class="plaque"><div class="in"><h1>The Tabernacle</h1><p>Exodus 25–30, to the measurements given</p></div><div class="weave"></div></div>
  <button class="pill" id="placesBtn" aria-haspopup="dialog">Places</button>
</div>
<div class="dock">
  <button class="pill" id="runBtn" aria-pressed="false">Run: <b>off</b></button>
  <button class="pill" id="viewBtn">View: <b>behind Aaron</b></button>
  <button class="pill" id="coverBtn">Tent covers: <b>on</b></button>
  <button class="pill" id="bellBtn">Robe bells: <b>on</b></button>
</div>
<div class="hint" id="hint">You are Aaron, the high priest. Use the stick at bottom left to walk; push it all the way, tap Run, or hold Shift to run. Drag anywhere else to look around. Tap any object to read what Exodus says about it.</div>
<div class="stick" id="stick" role="application" aria-label="Walking stick: drag to move Aaron"><div class="knob" id="knob"></div></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="cardTitle">
  <div class="weave"></div>
  <div class="head"><div><h2 id="cardTitle"></h2><p class="ref" id="cardRef"></p></div><button class="x" id="cardClose">Close</button></div>
  <div class="body" id="cardBody"></div>
</section>
<aside class="drawer" id="drawer" role="dialog" aria-label="Places">
  <div class="head"><h2>Places</h2><button class="x" id="drawerClose">Close</button></div>
  <div class="weave"></div>
  <div class="list" id="placeList"></div>
</aside>
<div class="fade" id="fade"></div>
<div class="loading" id="loading">Laying out the courtyard…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const PI=Math.PI;

/* Plain-English summaries with references. 1 cubit taken as ~46 cm. */
const INFO={
about:{t:'How to read this model',r:'Exodus 25–30 (the instructions) and 35–40 (the building)',
 p:['Everything is built to the measurements Exodus gives, using 1 cubit ≈ 18 in / 46 cm. Ancient cubits varied (roughly 44–52 cm), so treat metric figures as approximate.',
    'Each card summarises the verses in plain English. Open your NIV at the reference shown to read the exact wording alongside.',
    'Where Exodus is silent (the lampstand’s height, the basin’s size, the cherubim’s faces) the model makes a reasonable guess, and the card says so in an interpretation note.',
    'You walk as Aaron, the high priest, dressed in the garments of Exodus 28. Only he entered the Most Holy Place, once a year (Leviticus 16).',
    'Colours follow the text wherever it gives them: blue, purple and scarlet yarn, fine linen, gold, silver, bronze, and ram skins dyed red. Where Exodus names the materials but no design (the gate and the entrance screen), only the plain woven threads are shown.',
    'Controls: the stick at bottom left walks Aaron (W, A, S, D or arrow keys on a keyboard). To run, push the stick to its edge, tap Run, or hold Shift. Drag anywhere else to look around. Pinch or scroll to zoom.'],
 n:'Chapters 36–40 repeat these instructions almost word for word as Bezalel and Oholiab carry them out, which is a useful cross-check for any detail.'},
offering:{t:'The offering for the sanctuary',r:'Exodus 25:1–9; 35:4–29; 36:3–7; 38:24–31',
 p:['God tells Moses to receive an offering from everyone whose heart moves them to give.',
    'The materials: gold, silver and bronze; blue, purple and scarlet yarn; fine linen; goat hair; ram skins dyed red; durable leather; acacia wood; olive oil for the light; spices for the anointing oil and incense; onyx and other gemstones for the ephod and breastpiece.',
    'The purpose (25:8–9): make a sanctuary so that God may dwell among his people, following exactly the pattern shown to Moses.',
    'The people gave so much that the craftsmen reported a surplus and Moses had to tell everyone to stop bringing gifts (36:5–7).',
    'The silver came from a half-shekel given by each of the 603,550 men counted (38:25–26).'],
 d:[['Gold','29 talents + 730 shekels (38:24)'],['Silver','100 talents + 1,775 shekels (38:25)'],['Bronze','70 talents + 2,400 shekels (38:29)']],
 n:'A talent is often estimated at about 34 kg, which puts the gold at roughly a tonne. Ancient weights varied, so these are estimates.'},
courtyard:{t:'The courtyard',r:'Exodus 27:9–19; 38:9–20',
 p:['An enclosure 100 cubits long on the north and south sides and 50 cubits wide on the west and east.',
    'Its walls are curtains of finely twisted linen, 5 cubits high.',
    'The posts stand on bronze bases and carry silver hooks and bands; their tops were overlaid with silver (38:17).',
    'All the tent pegs, for the tabernacle and the courtyard, are bronze; they are listed with their ropes (35:18; 39:40).'],
 d:[['Length','100 cubits ≈ 46 m'],['Width','50 cubits ≈ 23 m'],['Wall height','5 cubits ≈ 2.3 m']],
 n:'The text gives 20 posts per long side, 10 on the west, and 3 + 3 + 4 on the east: 60 in all. It doesn’t say how corner posts were counted, so here the posts simply stand every 5 cubits around the edge. The posts’ own material isn’t named, and how the ropes were laid out is a guess.'},
gate:{t:'The courtyard gate',r:'Exodus 27:13–16; 38:14–18',
 p:['The only way in, on the east side, facing the sunrise.',
    'A curtain 20 cubits long of blue, purple and scarlet yarn and finely twisted linen, the work of an embroiderer, on 4 posts with 4 bases.',
    'On each side of it hang plain linen curtains 15 cubits long on 3 posts.'],
 d:[['Gate width','20 cubits ≈ 9 m'],['Height','5 cubits ≈ 2.3 m']],
 n:'Exodus names the materials (blue, purple and scarlet yarn with finely twisted linen) but not the design, so the curtain shows only those threads woven together, with no invented pattern.'},
altar:{t:'The altar of burnt offering',r:'Exodus 27:1–8; 38:1–7; 29:38–42',
 p:['Made of acacia wood, square, 5 cubits by 5 cubits and 3 cubits high.',
    'A horn at each of the four corners, made of one piece with the altar, and the whole altar overlaid with bronze.',
    'All its utensils are bronze: pots for the ashes, shovels, sprinkling bowls, meat forks and firepans (set beside the altar here).',
    'A bronze network grating sits under the ledge, halfway up the altar, with a bronze ring at each corner for carrying poles of acacia overlaid with bronze.',
    'It is hollow, made of boards.',
    'The daily offering (29:38–42): a year-old lamb each morning and another at twilight, with flour mixed with oil, and wine as a drink offering.'],
 d:[['Size','5 × 5 cubits ≈ 2.3 × 2.3 m'],['Height','3 cubits ≈ 1.4 m']],
 n:'Exodus doesn’t say how the priests reached the top. Since 20:26 forbids steps up to an altar, many reconstructions add an earth ramp; it’s left out here. The fire follows Leviticus 6:13, which says it must never go out.'},
laver:{t:'The bronze basin',r:'Exodus 30:17–21; 38:8; 40:30–32',
 p:['A bronze basin on a bronze stand, placed between the tent and the altar, filled with water.',
    'Aaron and his sons must wash their hands and feet before entering the tent or approaching the altar; the text makes it a matter of life and death.',
    'It was made from the bronze mirrors of the women who served at the entrance to the tent of meeting (38:8).'],
 n:'No size or shape is given anywhere in Exodus, so this basin is a guess.'},
frames:{t:'The frames and bases',r:'Exodus 26:15–30; 36:20–34; 38:27',
 p:['Upright frames of acacia wood, each 10 cubits tall and 1½ cubits wide, with two projections that fit into bases.',
    '20 frames on the south side, 20 on the north, 6 at the west end, plus 2 corner frames.',
    'Each frame stands on two silver bases: 96 in all. With the 4 bases under the inner curtain’s posts, that makes 100, cast from 100 talents of silver, one talent per base (38:27).',
    'Five crossbars hold each side together; the middle one runs from end to end.',
    'Frames and crossbars are overlaid with gold, and gold rings on the frames hold the crossbars (26:29).'],
 d:[['Each frame','10 × 1½ cubits ≈ 4.6 m × 69 cm'],['Tent (derived)','about 30 × 10 cubits ≈ 13.7 × 4.6 m']],
 n:'Frame thickness isn’t given, and the exact width at the back is debated; the 30 × 10 layout here is the most common reconstruction. Turn tent covers off to see the frames.'},
coverings:{t:'The four coverings',r:'Exodus 26:1–14; 36:8–19',
 p:['Innermost: ten curtains of finely twisted linen with blue, purple and scarlet yarn and cherubim woven in. Each is 28 × 4 cubits, joined in two sets of five by 50 blue loops and 50 gold clasps so the tabernacle is one unit.',
    'Over that: eleven curtains of goat hair, each 30 × 4 cubits, joined by 50 bronze clasps. The sixth is folded double at the front, and the extra half-curtain hangs down at the back (26:9, 12).',
    'Then a covering of ram skins dyed red, and on top a covering of durable leather.',
    'From inside, the cherubim-woven linen is your ceiling. The row of gold clasps joining the two sets of curtains marks where the inner curtain hangs (26:6, 33).'],
 d:[['Linen curtain','28 × 4 cubits ≈ 12.8 × 1.8 m'],['Goat hair curtain','30 × 4 cubits ≈ 13.7 × 1.8 m']],
 n:'Whether the roof was flat or ridged, and how far each layer hung down the sides, is debated. This model uses a flat roof with the leather reaching the ground. Exodus gives no colour for the goat hair or the durable leather, so dark hair and natural leather are assumed.'},
entrance:{t:'The entrance screen',r:'Exodus 26:36–37; 36:37–38',
 p:['A curtain for the tent’s east entrance, of blue, purple and scarlet yarn and finely twisted linen, the work of an embroiderer.',
    'It hangs by gold hooks on five posts of acacia overlaid with gold.',
    'The five bases are bronze.'],
 n:'Notice the metals: bronze bases outside, silver bases inside, pure gold at the Ark. Many readers see the materials growing more precious as you approach God’s presence.'},
holyplace:{t:'The Holy Place',r:'Exodus 26:33–35; 40:22–27',
 p:['The outer room of the tent, about 20 cubits deep, where the priests served daily.',
    'The table stands on the north side and the lampstand opposite it on the south.',
    'The altar of incense stands in front of the inner curtain.',
    'There are no windows; the lampstand is the only light.'],
 d:[['Size (derived)','about 20 × 10 × 10 cubits']],
 n:'The inner curtain hangs under the clasps joining the linen curtains (26:33). Twenty cubits from the entrance is the usual deduction.'},
table:{t:'The table and the bread of the Presence',r:'Exodus 25:23–30; 37:10–16',
 p:['Acacia wood, 2 cubits long, 1 wide and 1½ high, overlaid with pure gold, with a gold molding around it.',
    'A rim a handbreadth wide goes around it, also with a gold molding.',
    'Four gold rings at the corners where the legs are, close to the rim, hold the gold-covered poles for carrying it.',
    'Its plates, dishes, pitchers and bowls for drink offerings are pure gold (one of each is shown).',
    'The bread of the Presence is to be on it before God at all times.'],
 d:[['Length','2 cubits ≈ 91 cm'],['Width','1 cubit ≈ 46 cm'],['Height','1½ cubits ≈ 69 cm']],
 n:'Twelve loaves in two stacks, replaced every Sabbath, come from Leviticus 24:5–9. Whether the rim sat on the tabletop or was a frame between the legs is debated; here it’s a frame between the legs.'},
lampstand:{t:'The lampstand',r:'Exodus 25:31–40; 27:20–21; 37:17–24',
 p:['Hammered out of pure gold, base and shaft, with its cups, buds and blossoms all one piece with it.',
    'Six branches, three on each side.',
    'Each branch has three cups shaped like almond flowers with buds and blossoms; the central shaft has four.',
    'A bud sits under each pair of branches where they leave the shaft (25:35).',
    'Seven lamps set so they light the space in front of it, with wick trimmers and trays of pure gold (on the floor beside it here).',
    'It used one talent of pure gold, about 34 kg.',
    'It burned clear oil of pressed olives from evening till morning (27:20–21).',
    'Moses is told to make it exactly like the pattern shown him on the mountain.'],
 n:'No height or width is given. The curved branches follow the Arch of Titus carving and later tradition; some scholars argue for straight branches.'},
incense:{t:'The altar of incense',r:'Exodus 30:1–10, 34–38; 37:25–29',
 p:['Acacia wood, 1 cubit square and 2 cubits high, with horns of one piece with it.',
    'Top, sides and horns overlaid with pure gold, with a gold molding around it.',
    'Gold rings below the molding hold gold-covered poles.',
    'It stands in front of the curtain that shields the Ark.',
    'Aaron burns fragrant incense on it every morning when he tends the lamps and again at twilight. No other incense or offering may be put on it.',
    'Once a year atonement is made on its horns.',
    'The incense recipe (30:34–38): gum resin, onycha, galbanum and pure frankincense in equal parts, salted, holy, and never to be copied for personal use.'],
 d:[['Top','1 × 1 cubit ≈ 46 cm square'],['Height','2 cubits ≈ 91 cm']]},
veil:{t:'The inner curtain',r:'Exodus 26:31–35; 36:35–36',
 p:['A curtain of blue, purple and scarlet yarn and finely twisted linen, with cherubim woven in by a skilled worker.',
    'It hangs with gold hooks on four posts of acacia overlaid with gold, standing on four silver bases.',
    'The Ark goes behind it. It separates the Holy Place from the Most Holy Place.'],
 n:'Leviticus 16 describes the high priest passing through it once a year, on the Day of Atonement. The New Testament picks up this image in Hebrews 9–10 and in the torn temple curtain of Matthew 27:51.'},
mostholy:{t:'The Most Holy Place',r:'Exodus 26:33–34',
 p:['The inner room behind the curtain, holding only the Ark with its atonement cover.',
    'By the frame measurements it is a perfect cube of 10 cubits each way.'],
 d:[['Size (derived)','10 × 10 × 10 cubits ≈ 4.6 m cube']],
 n:'Exodus mentions no light in this room; a faint light is added only so you can see. Exodus 40:34–35 describes the cloud and the glory of the Lord filling the tabernacle when it was finished.'},
ark:{t:'The Ark of the covenant',r:'Exodus 25:10–16, 21–22; 37:1–5',
 p:['A chest of acacia wood 2½ cubits long, 1½ wide and 1½ high.',
    'Overlaid with pure gold inside and out, with a gold molding around it.',
    'Four gold rings on its four feet, two on each side, hold poles of acacia overlaid with gold.',
    'The poles stay in the rings and are never removed.',
    'Inside go the tablets of the covenant law that God would give Moses.'],
 d:[['Length','2½ cubits ≈ 1.1 m'],['Width','1½ cubits ≈ 69 cm'],['Height','1½ cubits ≈ 69 cm']],
 n:'Whether the rings and poles were on the long sides or the short ends is debated. The poles here point toward the curtain, following 1 Kings 8:8, where their ends could be seen from the Holy Place.'},
cover:{t:'The atonement cover and cherubim',r:'Exodus 25:17–22; 37:6–9',
 p:['A cover of pure gold, 2½ cubits by 1½ cubits, on top of the Ark.',
    'Two cherubim of hammered gold, one at each end, made of one piece with the cover.',
    'Their wings spread upward, overshadowing the cover. They face each other, looking toward the cover.',
    'God promises to meet with Moses above the cover, between the cherubim, and give him his commands for Israel (25:22).'],
 d:[['Cover','2½ × 1½ cubits ≈ 1.1 m × 69 cm']],
 n:'Exodus doesn’t describe the cherubim’s faces, bodies or height, so these figures are deliberately simple.'},
priest:{t:'The high priest’s garments',r:'Exodus 28:1–5',
 p:['Aaron and his sons are set apart to serve as priests.',
    'Sacred garments are made for Aaron to give him dignity and honour: a breastpiece, an ephod, a robe, a woven tunic, a turban and a sash.',
    'Skilled workers make them from gold, blue, purple and scarlet yarn, and fine linen.',
    'Tap each part of Aaron to read about it.'],garment:true},
ephod:{t:'The ephod and onyx stones',r:'Exodus 28:6–14; 39:2–7',
 p:['Made of gold, blue, purple and scarlet yarn and finely twisted linen, the work of skilled hands.',
    'Two shoulder pieces are attached at its corners, and a woven waistband of the same materials is one piece with it.',

  [[1,.03,.7],[2.76,.01,.25]].forEach(([m,v,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.05);});
}

/* Input */
const ptrs=new Map();let dragMoved=false,downT=0,downX=0,downY=0,pinchD=0;
const pdist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;};
cv.addEventListener('pointerdown',e=>{
  ensureAudio();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){dragMoved=false;downT=performance.now();downX=e.clientX;downY=e.clientY;}
  else if(ptrs.size===2){dragMoved=true;pinchD=pdist();}
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const d=pdist();zoomBy(pinchD/d);pinchD=d;return;}
  if(!dragMoved&&Math.hypot(e.clientX-downX,e.clientY-downY)>8)dragMoved=true;
  if(dragMoved){look(dx,dy);lastDrag=clock.elapsedTime;}
});
const endPtr=e=>{const single=ptrs.size===1;ptrs.delete(e.pointerId);if(e.type==='pointerup'&&single&&!dragMoved&&performance.now()-downT<650)onTap(e.clientX,e.clientY);};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomBy(Math.exp(e.deltaY*.0012));},{passive:false});

function look(dx,dy){
  if(view==='aerial'){orbitYaw-=dx*.006;orbitPitch=clamp(orbitPitch+dy*.004,.2,1.45);return;}
  camYaw+=dx*.005;
  camPitch=clamp(camPitch-dy*.004,view==='first'?-1.2:-1.1,view==='first'?1.2:.35);
}
function zoomBy(f){
  if(view==='aerial')aerialDist=clamp(aerialDist*f,25,260);
  else if(view==='third')camDist=clamp(camDist*f,2.2,14);
  else{camera.fov=clamp(camera.fov*f,30,75);camera.updateProjectionMatrix();}
}
function onTap(x,y){
  raycaster.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1),camera);
  const hits=raycaster.intersectObjects(pickables,false);
  for(const h of hits){
    const o=h.object;
    if(!effVisible(o))continue;
    const scr=o.userData.screen;
    if(scr&&o.material.opacity<.6)continue;
    if(view==='first'&&isAvatar(o))continue;
    if(o.userData.ground)return;
    const k=findInfo(o);
    if(k)openCard(k);
    return;
  }
}
const stick=$('#stick'),knob=$('#knob');let stickId=null;
const hideHint=()=>$('#hint').classList.add('gone');
function moveStick(e){const r=stick.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const max=r.width/2-12,d=Math.hypot(dx,dy);if(d>max){dx*=max/d;dy*=max/d;}knob.style.transform='translate('+dx+'px,'+dy+'px)';jx=dx/max;jy=dy/max;}
stick.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();stickId=e.pointerId;try{stick.setPointerCapture(e.pointerId);}catch(_){}moveStick(e);hideHint();closeCard();inspect=false;});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e);});
const endStick=e=>{if(e.pointerId!==stickId)return;stickId=null;jx=jy=0;knob.style.transform='';};
stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
const MOVEKEYS=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
addEventListener('keydown',e=>{if(MOVEKEYS.includes(e.code)){K[e.code]=true;ensureAudio();hideHint();e.preventDefault();}if(e.code==='ShiftLeft'||e.code==='ShiftRight')K[e.code]=true;});
addEventListener('keyup',e=>{K[e.code]=false;});
addEventListener('blur',()=>{for(const k in K)K[k]=false;});

/* UI */
const sheet=$('#sheet'),drawer=$('#drawer');
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
const spotFor={};
PLACES.forEach(s=>s.items.forEach(([k,sp,cov])=>{if(Array.isArray(sp))spotFor[k]={sp:sp,cov:cov};}));

function openCard(k){
  const d=INFO[k];if(!d)return;
  $('#cardTitle').textContent=d.t;$('#cardRef').textContent=d.r;
  const b=$('#cardBody');b.innerHTML='';
  const acts=el('div','acts');
  if(spotFor[k]){const bt=el('button',null,'Take me there');bt.onclick=()=>goTo(k);acts.appendChild(bt);}
  if(k==='courtyard'){const bt=el('button',null,'See it from above');bt.onclick=()=>{setView('aerial');closeCard();};acts.appendChild(bt);}
  if(d.garment){const bt=el('button',null,'Look at Aaron');bt.onclick=()=>inspectPriest();acts.appendChild(bt);}
  if(k==='frames'||k==='coverings'){const bt=el('button',null,coversOn?'Hide tent covers':'Show tent covers');bt.onclick=()=>{setCovers(!coversOn);bt.textContent=coversOn?'Hide tent covers':'Show tent covers';};acts.appendChild(bt);}
  if(acts.children.length)b.appendChild(acts);
  const ul=el('ul');d.p.forEach(t=>ul.appendChild(el('li',null,t)));b.appendChild(ul);
  if(d.d){const dl=el('dl','dims');d.d.forEach(([a,v])=>{dl.appendChild(el('dt',null,a));dl.appendChild(el('dd',null,v));});b.appendChild(dl);}
  if(d.n){const n=el('div','note');n.appendChild(el('strong',null,'Interpretation note. '));n.appendChild(document.createTextNode(d.n));b.appendChild(n);}
  b.scrollTop=0;sheet.classList.add('open');
}
function closeCard(){sheet.classList.remove('open');}
$('#cardClose').onclick=closeCard;
{
  const list=$('#placeList');
  PLACES.forEach(s=>{
    list.appendChild(el('h3',null,s.sec));
    s.items.forEach(([k,sp])=>{
      const b=el('button','place');b.appendChild(el('span',null,INFO[k].t));b.appendChild(el('small',null,INFO[k].r.split(';')[0]));
      b.onclick=()=>{drawer.classList.remove('open');
        if(sp==='aerial'){setView('aerial');openCard(k);}
        else if(Array.isArray(sp))goTo(k);
        else if(INFO[k].garment){inspectPriest();openCard(k);}
        else openCard(k);};
      list.appendChild(b);
    });
  });
}
$('#placesBtn').onclick=()=>drawer.classList.add('open');
$('#drawerClose').onclick=()=>drawer.classList.remove('open');

function goTo(k){
  const s=spotFor[k];if(!s)return;
  const [x,z,tx,tz]=s.sp;
  const f=$('#fade');f.classList.add('on');closeCard();
  setTimeout(()=>{
    P.x=x;P.z=z;P.facing=Math.atan2(tz-z,tx-x);camYaw=P.facing;
    if(view==='aerial')setView('third');
    const tn=inTent(x,z);camPitch=view==='first'?-.12:(tn?-.32:-.22);camDist=tn?5.4:7;
    moving=false;inspect=false;
    if(s.cov==='off')setCovers(false);if(s.cov==='on')setCovers(true);
    $('#hint').classList.add('gone');
    f.classList.remove('on');openCard(k);
  },230);
}
function inspectPriest(){if(view!=='third')setView('third');inspect=true;moving=false;camYaw=P.facing+PI;camPitch=-.05;camDist=2.8;}
const VIEWS=['third','first','aerial'],VNAME={third:'behind Aaron',first:'Aaron’s eyes',aerial:'from above'};
function setView(v){view=v;$('#viewBtn').innerHTML='View: <b>'+VNAME[v]+'</b>';priest.visible=v!=='first';if(v!=='first'){camera.fov=58;camera.updateProjectionMatrix();}if(v==='first')camPitch=clamp(camPitch,-.4,.3);}
$('#viewBtn').onclick=()=>setView(VIEWS[(VIEWS.indexOf(view)+1)%3]);
function setCovers(on){coversOn=on;covers.visible=on;$('#coverBtn').innerHTML='Tent covers: <b>'+(on?'on':'off')+'</b>';}
$('#coverBtn').onclick=()=>setCovers(!coversOn);
$('#runBtn').onclick=()=>{runOn=!runOn;$('#runBtn').innerHTML='Run: <b>'+(runOn?'on':'off')+'</b>';$('#runBtn').setAttribute('aria-pressed',String(runOn));};
$('#bellBtn').onclick=()=>{bellsOn=!bellsOn;ensureAudio();$('#bellBtn').innerHTML='Robe bells: <b>'+(bellsOn?'on':'off')+'</b>';if(bellsOn)ring();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeCard();drawer.classList.remove('open');}});

/* Loop */
const tmpV=new THREE.Vector3(),head=new THREE.Vector3(),lookV=new THREE.Vector3(),back=new THREE.Vector3(),orbitC=new THREE.Vector3(-5,0,0);
const TRY=[0,.45,-.45,.9,-.9,1.35,-1.35];
function update(dt,t){
  let ix=jx,iy=jy;
  if(K.KeyW||K.ArrowUp)iy-=1;if(K.KeyS||K.ArrowDown)iy+=1;if(K.KeyA||K.ArrowLeft)ix-=1;if(K.KeyD||K.ArrowRight)ix+=1;
  const mag=Math.min(1,Math.hypot(ix,iy));
  moving=mag>.15;
  if(moving){
    inspect=false;
    const yr=view==='aerial'?orbitYaw+PI:camYaw,fx=Math.cos(yr),fz=Math.sin(yr);
    const mx=fx*(-iy)-fz*ix,mz=fz*(-iy)+fx*ix,a0=Math.atan2(mz,mx),running=runOn||K.ShiftLeft||K.ShiftRight||Math.hypot(jx,jy)>.93,st=SPEED*(running?2.2:1)*mag*dt;let ok=false;
    for(const o of TRY){const a=a0+o,nx=P.x+Math.cos(a)*st,nz=P.z+Math.sin(a)*st;if(!blocked(nx,nz)){P.x=nx;P.z=nz;ok=true;break;}}
    if(view!=='first'&&ok)P.facing+=angDiff(P.facing,a0)*Math.min(1,dt*10);
    if(ok)stepT+=dt*(.5+mag*.5)*(running?1.7:1);else moving=false;
  }
  if(view==='first')P.facing=camYaw;
  priest.position.set(P.x,0,P.z);
  priest.rotation.y=PI/2-P.facing;
  const sw=moving?Math.sin(stepT*9):0;
  body.position.y=moving?Math.abs(sw)*.05:body.position.y*.85;
  armL.rotation.x=moving?sw*.35:armL.rotation.x*.85;armR.rotation.x=-armL.rotation.x;
  if(moving){const s=Math.sign(sw);if(s!==0&&s!==lastBob){lastBob=s;ring();}}

  if(view==='aerial'){
    camera.position.set(orbitC.x+Math.cos(orbitPitch)*Math.cos(orbitYaw)*aerialDist,Math.sin(orbitPitch)*aerialDist,orbitC.z+Math.cos(orbitPitch)*Math.sin(orbitYaw)*aerialDist);
    camera.lookAt(orbitC);
  }else{
    lookV.set(Math.cos(camPitch)*Math.cos(camYaw),Math.sin(camPitch),Math.cos(camPitch)*Math.sin(camYaw));
    if(view==='first'){
      camera.position.set(P.x,3.45+body.position.y,P.z);
      camera.lookAt(tmpV.copy(camera.position).add(lookV));
    }else{
      const sh=inspect?0:.95;
      head.set(P.x-Math.sin(camYaw)*sh,inspect?2.7:3.3,P.z+Math.cos(camYaw)*sh);
      let dist=inspect?camDist:(inTent(P.x,P.z)?Math.min(camDist,5.4):camDist);
      back.copy(lookV).negate();
      raycaster.set(head,back);raycaster.far=dist+.3;
      const hs=raycaster.intersectObjects(camBlockers,false);
      for(const h of hs){if(effVisible(h.object)){dist=Math.max(.7,Math.min(dist,h.distance-.35));break;}}
      raycaster.far=Infinity;
      camera.position.copy(head).addScaledVector(back,dist);
      if(camera.position.y<.4)camera.position.y=.4;
      camera.lookAt(head.x+lookV.x,head.y+lookV.y,head.z+lookV.z);
    }
  }

  const cx=camera.position.x;
  for(const s of screens){
    let op=1;
    if(view!=='aerial'){
      const near=Math.abs(P.x-s.at)<3.2&&P.z>s.min-1&&P.z<s.max+1;
      const cross=(P.x-s.at)*(cx-s.at)<0&&Math.abs(P.z)<s.max+4;
      if(cross)op=.08;else if(near)op=.22;
    }
    const m=s.mesh.material;m.opacity+=(op-m.opacity)*Math.min(1,dt*7);m.depthWrite=m.opacity>.95;
  }

  flames.forEach((f,i)=>{const k=1+Math.sin(t*11+i*1.7)*.12+Math.sin(t*23+i)*.06;const b=f.userData.base;const s=(b?1.6:.32)*k;f.scale.set(s*(b?1:.7),s,1);if(b)f.position.y=b+Math.sin(t*4+i)*.15;});
  lampLight.intensity=1.2+Math.sin(t*13)*.06+Math.sin(t*29)*.04;
  altarLight.intensity=1.4+Math.sin(t*9)*.18+Math.sin(t*17)*.1;
  smoke.forEach(s=>{const u=(t*.18+s.userData.t)%1;s.position.set(Math.sin(u*9+s.userData.t*6)*.15,2.15+u*3.2,Math.cos(u*7)*.1);s.material.opacity=Math.sin(u*PI)*.28;const sc=.35+u*1.2;s.scale.set(sc,sc,1);});

  const W=innerWidth,H=innerHeight,cp=camera.position,camIn=inTent(cp.x,cp.z)&&cp.y<10;
  const inYard=Math.abs(cp.x)<50&&Math.abs(cp.z)<25;
  LABELS.forEach(L=>{L.d=cp.distanceTo(L.p);});
  const placed=[];
  LABELS.slice().sort((a,b)=>a.d-b.d).forEach(L=>{
    let show;
    if(view==='aerial')show=L.zone!=='in'||!coversOn;
    else if(camIn)show=L.zone==='in';
    else if(inYard)show=L.zone!=='in'||!coversOn;
    else show=L.zone==='gate'||(!coversOn&&false);
    if(show&&view!=='aerial'&&L.d>70)show=false;
    let sx=0,sy=0;
    if(show){tmpV.copy(L.p).project(camera);if(tmpV.z>1||tmpV.z<-1||Math.abs(tmpV.x)>1.05||Math.abs(tmpV.y)>1.05)show=false;else{sx=(tmpV.x+1)/2*W;sy=(1-tmpV.y)/2*H;}}
    if(show){const w=(L.w||(L.w=L.el.offsetWidth||90))/2+4;for(const q of placed){if(Math.abs(q[0]-sx)<w+q[2]&&Math.abs(q[1]-sy)<28){show=false;break;}}if(show)placed.push([sx,sy,w]);}
    if(show){L.el.style.display='block';L.el.style.transform='translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px) translate(-50%,-100%)';}
    else L.el.style.display='none';
  });
}
let first=true;
function frame(){
  const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
  update(dt,t);
  renderer.render(scene,camera);
  if(first){first=false;$('#loading').classList.add('done');}
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
setView('third');
frame();
})();
</script>
</body>
